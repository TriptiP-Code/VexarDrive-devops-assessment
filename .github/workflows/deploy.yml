name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/setup-azcli@v2

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker Image
        run: |
          set -e

          docker build \
            -t vexar-fleet-ping:latest \
            -t vexar-fleet-ping:${{ github.sha }} .

      - name: Login to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            vexaracr.azurecr.io \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Push Docker Images
        run: |
          set -e

          docker tag vexar-fleet-ping:latest \
            vexaracr.azurecr.io/vexar-fleet-ping:latest

          docker tag vexar-fleet-ping:${{ github.sha }} \
            vexaracr.azurecr.io/vexar-fleet-ping:${{ github.sha }}

          docker push vexaracr.azurecr.io/vexar-fleet-ping:latest
          docker push vexaracr.azurecr.io/vexar-fleet-ping:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          set -e

          az containerapp update \
            --name vexar-fleet-ping \
            --resource-group vexar-prod-rg \
            --image vexaracr.azurecr.io/vexar-fleet-ping:${{ github.sha }}

      - name: Verify Azure Login
        run: az account show