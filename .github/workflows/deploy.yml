name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Application Starts
        run: |
          timeout 10s npm start || true

      - name: Build Docker Image
        run: |
          docker build -t vexar-fleet-ping:${{ github.sha }} .

      - name: Verify Docker Image
        run: |
          docker images | grep vexar-fleet-ping